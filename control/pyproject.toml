[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "myfw-ops"
version = "2.0.0"
description = "Policy-as-code control plane for the myfw kernel firewall: validate, diff, transactional apply, confirm/rollback, diagnose, collect"
readme = "../README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6,<3",
    "typer>=0.12",
    "pyyaml>=6",
    "prometheus_client>=0.20",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
fwctl = "myfw_ops.cli:main"
myfw-agent = "myfw_ops.agent:main"
myfw-guard = "myfw_ops.guard:main"
myfw-boot = "myfw_ops.boot:main"
myfw-collector = "myfw_ops.collector:main"
myfw-probe = "myfw_ops.probe:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
